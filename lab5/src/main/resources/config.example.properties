# persistence type: MEMORY, FILE or DATABASE
repository.type=DATABASE

# for FILE (paths relative to the project folder)
file.users=data/users.txt
file.friendships=data/friendships.txt

# for DATABASE: run data/schema.sql in pgAdmin first, then fill in the real password below
# and copy this file to config.properties (config.properties is gitignored, this one is not)
db.url=jdbc:postgresql://localhost:5432/socialnetwork
db.user=postgres
db.password=CHANGE_ME
